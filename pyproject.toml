[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-to-arxml"
description = "Excel to AUTOSAR ARXML tools: table-to-system-arxml and table-to-swc-arxml"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[project.scripts]
table-to-system-arxml = "table_to_arxml.system.cli:main"
table-to-swc-arxml = "table_to_arxml.swc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "table_to_arxml.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "test"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py39"
src = ["src", "test", "tools"]
# 第三方脚本不归本工程维护，不做 lint。
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["F", "B", "E9"]
