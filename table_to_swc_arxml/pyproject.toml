[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-to-swc-arxml"
version = "0.2.0"
description = "Add AUTOSAR SWC ports, interfaces and data types to ARXML from Excel"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
table-to-swc-arxml = "table_to_swc_arxml.cli:main"

[tool.setuptools]
packages = ["table_to_swc_arxml", "table_to_swc_arxml.lib"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
