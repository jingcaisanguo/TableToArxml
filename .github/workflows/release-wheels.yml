name: Release tool wheel

on:
  push:
    tags:
      - 'tableToSystemArxml/*'
      - 'tableToSwcArxml/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Resolve tool and version from tag
        id: tool
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "${TAG%%/*}" in
            tableToSystemArxml) dir=table_to_system_arxml; command=table-to-system-arxml ;;
            tableToSwcArxml) dir=table_to_swc_arxml; command=table-to-swc-arxml ;;
            *) echo "Unknown tool in tag: $TAG" >&2; exit 1 ;;
          esac
          {
            echo "dir=$dir"
            echo "command=$command"
            echo "version=${TAG#*/}"
          } >> "$GITHUB_OUTPUT"
      - name: Build wheel
        env:
          TOOL_DIR: ${{ steps.tool.outputs.dir }}
        run: |
          python -m pip install build packaging
          python -m build --wheel --outdir dist "./$TOOL_DIR"
      - name: Verify tag matches wheel version
        env:
          EXPECTED: ${{ steps.tool.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          actual = parse_wheel_filename(wheels[0].name)[1]
          expected = Version(os.environ["EXPECTED"])
          assert actual == expected, f"Tag version {expected} does not match wheel version {actual}"
          PY
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed command outside checkout
        working-directory: ${{ runner.temp }}
        env:
          TOOL_COMMAND: ${{ steps.tool.outputs.command }}
        run: |
          "$TOOL_COMMAND" --help
      - name: Publish wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl --verify-tag --title "$TAG" --generate-notes
          fi
