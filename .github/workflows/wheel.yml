name: Build wheel

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tools/verify_wheel.py'
      - 'tools/package_user_docs.py'
      - 'docs/user/**'
      - 'test/samples/**'
      - 'test/data/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tools/verify_wheel.py'
      - 'tools/package_user_docs.py'
      - 'docs/user/**'
      - 'test/samples/**'
      - 'test/data/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Verify installed wheel and real conversion baselines
        run: |
          python tools/verify_wheel.py
          python tools/package_user_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: table-to-arxml-distribution
          path: |
            dist/*.whl
            dist/*-user-guide.zip
          if-no-files-found: error
