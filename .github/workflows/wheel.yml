name: Build wheel

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/wheel.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/wheel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed commands outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          table-to-system-arxml --help
          python -m table_to_arxml.system --help
          table-to-swc-arxml --help
          python -m table_to_arxml.swc --help
          python -c "import table_to_arxml.common.dependencies as d; d.check_dependencies()"

          # 参数和配置错误：退出码 2，不创建日志。
          set +e
          table-to-swc-arxml --project-root . --arxml-file-list missing.lst 2>error.txt
          status=$?
          set -e
          test "$status" -eq 2
          grep -q -- '--workbook, --log-dir required' error.txt

          set +e
          table-to-system-arxml 2>error.txt
          status=$?
          set -e
          test "$status" -eq 2
          grep -q -- 'config.json' error.txt
      - uses: actions/upload-artifact@v4
        with:
          name: table-to-arxml-wheel
          path: dist/*.whl
          if-no-files-found: error
