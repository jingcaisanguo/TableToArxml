name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Source ref to validate'
        required: false
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/user/swc/*.xlsx'
      - 'docs/**/*.md'
      - 'README.md'
      - 'init_venv.sh'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/user/swc/*.xlsx'
      - 'docs/**/*.md'
      - 'README.md'
      - 'init_venv.sh'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 最低支持版本、1.9.4 大改前的最后版本、当前最新验证版本。
        armodel: ['1.8.7', '1.9.2', '1.9.8']
        python: ['3.9', '3.13']
        openpyxl: ['>=3.1.5']
        include:
          - os: ubuntu-latest
            armodel: '1.9.8'
            python: '3.9'
            openpyxl: '==3.1.5'
          - os: windows-latest
            armodel: '1.9.8'
            python: '3.9'
            openpyxl: '==3.1.5'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: >-
          python -m pip install "armodel==${{ matrix.armodel }}" "openpyxl${{ matrix.openpyxl }}"
          -r requirements.txt
          pytest ruff build wheel "setuptools>=68" "setuptools-scm>=8,<9"
      # ruff 与 pytest 的选项都在 pyproject.toml 中配置。
      - name: Lint
        run: python -m ruff check
      - name: Run tests
        run: python -m pytest -q
      - name: Check environment script syntax
        shell: bash
        run: bash -n init_venv.sh
