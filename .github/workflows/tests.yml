name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/user/swc/*.xlsx'
      - 'docs/**/*.md'
      - 'docs/user/tableToSwcArxml/*.xlsx'
      - 'README.md'
      - 'init_venv.sh'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'docs/user/swc/*.xlsx'
      - 'docs/**/*.md'
      - 'docs/user/tableToSwcArxml/*.xlsx'
      - 'README.md'
      - 'init_venv.sh'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        armodel: ['1.8.7', '1.9.2']
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: >-
          python -m pip install "armodel==${{ matrix.armodel }}"
          -r requirements.txt
          pytest ruff
      # ruff 与 pytest 的选项都在 pyproject.toml 中配置。
      - name: Lint
        run: python -m ruff check
      - name: Run tests
        run: python -m pytest -q
      - name: Check environment script syntax
        shell: bash
        run: bash -n init_venv.sh
