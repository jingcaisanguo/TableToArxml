name: Release wheel

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be x.y.z with numeric parts: $TAG" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
  quality:
    needs: validate-tag
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheel
        run: |
          python -m pip install build "setuptools-scm>=8,<9"
          python -m build --wheel --outdir dist .
      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel=$(ls dist/*.whl)
          expected="table_to_arxml-${TAG}-py3-none-any.whl"
          if [ "$(basename "$wheel")" != "$expected" ]; then
            echo "Tag $TAG does not match pyproject.toml version: built $(basename "$wheel"), expected $expected" >&2
            exit 1
          fi
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed conversions and package user documentation
        run: |
          python tools/verify_wheel.py
          python tools/package_user_docs.py
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*-user-guide.zip \
            --verify-tag --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
