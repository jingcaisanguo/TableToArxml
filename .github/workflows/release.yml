name: Release wheel

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be x.y.z with numeric parts: $TAG" >&2
            exit 1
          fi
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel=$(ls dist/*.whl)
          expected="table_to_arxml-${TAG}-py3-none-any.whl"
          if [ "$(basename "$wheel")" != "$expected" ]; then
            echo "Tag $TAG does not match pyproject.toml version: built $(basename "$wheel"), expected $expected" >&2
            exit 1
          fi
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed commands outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          table-to-system-arxml --help
          table-to-swc-arxml --help
      - name: Publish wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl --verify-tag --title "$TAG" --generate-notes
          fi
