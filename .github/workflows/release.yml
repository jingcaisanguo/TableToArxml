name: Release wheel

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '需要补齐附件的已有版本标签（x.y.z）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.release.tag_name || github.ref_name) }}
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be x.y.z with numeric parts: $TAG" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: |
            tools/release_assets.py
            tools/package_user_docs.py
          sparse-checkout-cone-mode: false
      - name: Check release state before testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          RECOVER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python release-tools/tools/release_assets.py preflight
  quality:
    needs: validate-tag
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.release.tag_name || github.ref_name) }}
    permissions:
      contents: read
  release:
    needs: quality
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TABLE_TO_ARXML: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.release.tag_name || github.ref_name) }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: |
            tools/release_assets.py
            tools/package_user_docs.py
          sparse-checkout-cone-mode: false
      - name: Build wheel
        run: |
          python -m pip install build "setuptools-scm>=8,<9"
          python -m build --wheel --outdir dist .
      - name: Verify tag matches project version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          wheel=$(ls dist/*.whl)
          expected="table_to_arxml-${TAG}-py3-none-any.whl"
          if [ "$(basename "$wheel")" != "$expected" ]; then
            echo "Tag $TAG does not match wheel version: built $(basename "$wheel"), expected $expected" >&2
            exit 1
          fi
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed conversions and package user documentation
        run: |
          python tools/verify_wheel.py
          python release-tools/tools/package_user_docs.py --source-root "$GITHUB_WORKSPACE"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          RECOVER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python release-tools/tools/release_assets.py publish
