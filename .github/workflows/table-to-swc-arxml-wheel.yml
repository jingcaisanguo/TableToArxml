name: Build table-to-swc-arxml wheel

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'table_to_swc_arxml/**'
      - '.github/workflows/table-to-swc-arxml-wheel.yml'
    tags:
      - 'table-to-swc-arxml-v*'
  pull_request:
    paths:
      - 'table_to_swc_arxml/**'
      - '.github/workflows/table-to-swc-arxml-wheel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir ./table_to_swc_arxml ./table_to_swc_arxml
      - name: Install wheel
        run: |
          python -m pip install table_to_swc_arxml/*.whl
          python -m pip check
      - name: Check installed command outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          table-to-swc-arxml --help
          python -m table_to_swc_arxml --help
          if table-to-swc-arxml --project-root . --arxml-file-list missing.lst 2>error.txt; then
            echo "Missing workbook and log directory must fail" && exit 1
          fi
          grep -q -- '--workbook, --log-dir required' error.txt
      - uses: actions/upload-artifact@v4
        with:
          name: table-to-swc-arxml-wheel
          path: table_to_swc_arxml/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/table-to-swc-arxml-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: table-to-swc-arxml-wheel
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify tag matches wheel version
        run: |
          python -m pip install packaging
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          expected = Version(os.environ["GITHUB_REF_NAME"].removeprefix("table-to-swc-arxml-v"))
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          assert parse_wheel_filename(wheels[0].name)[1] == expected
          PY
      - name: Publish wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl --verify-tag --title "$TAG" --generate-notes
          fi
