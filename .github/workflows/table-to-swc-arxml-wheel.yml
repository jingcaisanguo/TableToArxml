name: Build table-to-swc-arxml wheel

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'table_to_swc_arxml/**'
      - '.github/workflows/table-to-swc-arxml-wheel.yml'
  pull_request:
    paths:
      - 'table_to_swc_arxml/**'
      - '.github/workflows/table-to-swc-arxml-wheel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir ./table_to_swc_arxml ./table_to_swc_arxml
      - name: Install wheel
        run: |
          python -m pip install table_to_swc_arxml/*.whl
          python -m pip check
      - name: Check installed command outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          table-to-swc-arxml --help
          python -m table_to_swc_arxml --help
          if table-to-swc-arxml --project-root . --arxml-file-list missing.lst 2>error.txt; then
            echo "Missing workbook and log directory must fail" && exit 1
          fi
          grep -q -- '--workbook, --log-dir required' error.txt
      - uses: actions/upload-artifact@v4
        with:
          name: table-to-swc-arxml-wheel
          path: table_to_swc_arxml/*.whl
          if-no-files-found: error
